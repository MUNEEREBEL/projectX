org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 2.3.20 + Gradle 9.1 Build Tools API daemon intermittently corrupts its
# incremental caches on Windows ("Could not close incremental caches ...
# class-fq-name-to-source.tab ... is already registered"), failing
# :flutter_onnxruntime:compileDebugKotlin before app code is even reached.
# Disabling Kotlin incremental compilation removes the .tab cache entirely.
# Trade-off: slightly slower Kotlin rebuilds; no effect on correctness.
kotlin.incremental=false

# Gradle's file-system watching (VFS) owns caches/<gradle-ver>/file-changes/
# last-build.bin. On this Windows box that .bin is intermittently locked
# mid-write ("Access is denied"), failing assembleDebug AFTER the native
# arm64 compile has already succeeded. Turning VFS watching off stops Gradle
# from maintaining that state file, so the lock can't occur.
# Trade-off: Gradle re-stats inputs each build instead of using OS file
# notifications to short-circuit up-to-date checks (marginally slower on a
# warm daemon); zero effect on build correctness.
org.gradle.vfs.watch=false
